name: 要望 / Feature request
description: 機能や改善を提案する / Suggest a feature or improvement
title: "[要望 / Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと / What would you like to solve?
      description: 個人情報や秘密の値は書かないでください。/ Do not include personal information or secrets.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案 / Your suggestion
    validations:
      required: true
